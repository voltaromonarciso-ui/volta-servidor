name: App de móvil

# Construye el APK de Android (versión de pruebas) con Capacitor y lo deja para descargar en la pestaña
# «Actions» de GitHub › esta ejecución › «Artifacts» › volta-android.
on:
  push:
    paths:
      - 'Volta-app.html'
      - 'public/**'
      - 'movil/**'
      - '.github/workflows/movil.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movil/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Dependencias de Capacitor
        working-directory: movil
        run: npm ci
      - name: Copiar la app y sincronizar Android
        working-directory: movil
        run: node scripts/www.js && npx cap sync android
      - name: Construir el APK
        working-directory: movil/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Renombrar
        run: cp movil/android/app/build/outputs/apk/debug/app-debug.apk volta-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: volta-android
          path: volta-android.apk
          retention-days: 30
