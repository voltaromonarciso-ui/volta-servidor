name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: volta
          POSTGRES_PASSWORD: volta
          POSTGRES_DB: volta_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U volta"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://volta:volta@localhost:5432/volta_test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Volta-app.html está al día con frontend/
        run: npm run build:app && git diff --exit-code Volta-app.html
      - run: npx playwright install --with-deps chromium
      - run: npm run test:app
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-pruebas-app
          path: test/app/out/shots
