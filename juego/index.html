<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14181f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Bloque 9</title>
</head>
<body>
  <div id="app"></div>
  <div id="touch-layer"></div>
  <div id="joy"><span class="ch u"></span><span class="ch d"></span><span class="ch l"></span><span class="ch r"></span><div id="joy-knob"></div></div>

  <div id="hud" class="hide">
    <div id="tl">
      <button id="btn-pause" class="sq"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
      <div id="minimap"><canvas id="mm"></canvas><div class="mm-n">N</div></div>
    </div>
    <div id="clockbox"><span id="h-clock">17:00</span> · <span id="h-day">Lun</span><span id="h-curfew" class="curfew"> · Toque de queda</span></div>
    <div id="quest"><div id="q-title"></div><div id="q-desc"></div></div>

    <div id="tr">
      <div id="cash"><span class="cash-ic"><i></i><i></i><i></i></span><span id="h-money">0</span></div>
      <div id="rank"><span id="rank-name"></span><div class="bar"><i id="rank-bar"></i></div><span id="rank-xp"></span></div>
      <div class="tr-btns">
        <button id="btn-bag" class="rb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 6V5a3 3 0 0 1 6 0v1"/><rect x="5" y="6" width="14" height="15" rx="4"/><path d="M8.5 13h7v4h-7z"/><path d="M5 12h14"/></svg></button>
        <button id="btn-phone" class="rb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg><i id="phone-badge" class="badge"></i></button>
      </div>
      <div id="h-water" class="water"></div>
    </div>

    <div id="waypoint"><div id="wp-arrow">▲</div><div id="wp-text"></div></div>
    <div id="wanted"><div>🚨 TE BUSCA LA POLICÍA · ¡Escóndete!</div><div class="bar"><i id="wanted-bar"></i></div></div>

    <div id="crosshair"></div>
    <div id="prompt"></div>
    <div id="info"></div>

    <div id="actions">
      <button id="btn-use" class="cb big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11.5V4a1.5 1.5 0 0 1 3 0v7.5"/><path d="M14 11.5V5.5a1.5 1.5 0 0 1 3 0V13"/><path d="M17 9.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1.2a6 6 0 0 1-4.6-2.2L3.5 15.6a1.6 1.6 0 0 1 2.4-2.1L8 15.5"/></svg></button>
      <button id="btn-crouch" class="cb"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="4" r="2.2"/><path d="M10 7.5h3.2l2.6 4.6-1.7 1L12.8 11l-.9 3.6 3.6 1.6.9 5.3h-2l-.8-4-4.4-2c-.9-.4-1.3-1.4-1.1-2.3l1.2-4.4-1.6.9-1.2 3.1-1.8-.7 1.5-4c.2-.5.6-.9 1-1.1z"/></svg></button>
      <button id="btn-run" class="cb"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="14.5" cy="3.8" r="2.1"/><path d="M11.2 7.2l3.6-.6c.6-.1 1.2.2 1.5.7l1.6 3 3 .8-.5 1.9-3.6-1-1-1.8-1.5 3.5 2.9 2.4-.9 6h-2l.7-4.9-3.2-2.4-1.6 3.7-5 .2-.1-2 3.8-.2 3.1-7.2-1.6.3-1.9 2.7-1.6-1.1 2.2-3.1c.2-.3.6-.5 1-.6z"/></svg></button>
      <button id="btn-alt" class="cb sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg><span id="alt-label"></span></button>
      <button id="btn-jump" class="cb sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/><path d="M6 19h12"/></svg></button>
    </div>

    <div id="hotbar"></div>
    <div id="toasts"></div>
    <div id="notify"></div>
    <div id="fps"></div>
  </div>
  <div id="phone"></div>
  <div id="ui-layer"></div>
  <div id="fade"></div>

  <div id="menu">
    <div class="m-box">
      <div class="logo"><span>BLOQUE</span><b>9</b></div>
      <div class="tag">Puerto Lomas · Simulador de negocio callejero</div>
      <button id="m-continue" class="btn big">Continuar</button>
      <button id="m-new" class="btn big ghost">Nueva partida</button>
      <div class="m-foot">Ficción. Todos los productos, personajes y lugares son inventados.</div>
    </div>
  </div>
  <div id="rotate"><div>📱↻</div><p>Gira el móvil en horizontal para jugar</p></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
